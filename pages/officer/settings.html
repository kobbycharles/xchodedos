<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>xchodedos — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:#1a56db; --brand-dark:#1239a5; --brand-light:#e8eeff;
      --success:#12b76a; --success-bg:#ecfdf3; --warning:#f59e0b; --warning-bg:#fffbeb;
      --danger:#ef4444; --danger-bg:#fef2f2;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
      --gray-400:#9ca3af; --gray-600:#4b5563; --gray-700:#374151;
      --gray-800:#1f2937; --gray-900:#111827;
      --border:#e5e7eb; --bg:#f5f7ff;
      --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
      --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:9999px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.08); --nav-h:64px;
    }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:var(--font-body); background:var(--bg); color:var(--gray-800); min-height:100dvh; }
    a { text-decoration:none; color:inherit; }
    button { cursor:pointer; font-family:inherit; }

    .top-bar { position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--border); padding:.875rem 1rem; display:flex; align-items:center; gap:.75rem; }
    .top-bar-logo { font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--brand); }
    .top-bar-title { font-weight:600; font-size:1rem; flex:1; }
    .top-bar-avatar { width:36px; height:36px; border-radius:var(--r-full); background:var(--brand-light); color:var(--brand); display:grid; place-items:center; font-weight:700; font-size:.8rem; cursor:pointer; }

    .page-content { padding:1.25rem 1rem calc(var(--nav-h) + 1.25rem); max-width:540px; margin:0 auto; }

    .settings-section { margin-bottom: 1.5rem; }
    .settings-label { font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gray-400); margin-bottom:.625rem; padding:0 .25rem; }
    .settings-list { background:#fff; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
    .settings-row { display:flex; align-items:center; gap:.875rem; padding:.875rem 1rem; border-bottom:1px solid var(--border); cursor:pointer; }
    .settings-row:last-child { border-bottom:none; }
    .settings-row.danger { color:var(--danger); }
    .settings-icon { width:36px; height:36px; border-radius:var(--r-sm); display:grid; place-items:center; flex-shrink:0; }
    .settings-icon.red { background:var(--danger-bg); color:var(--danger); }
    .settings-title { font-weight:600; font-size:.88rem; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:var(--nav-h); background:#fff; border-top:1px solid var(--border); display:flex; z-index:50; box-shadow:0 -4px 16px rgba(0,0,0,.06); }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.2rem; border:none; background:none; color:var(--gray-400); font-size:.65rem; font-weight:500; padding:.5rem 0; text-decoration:none; }
    .nav-item svg { width:22px; height:22px; }
    .nav-item.active { color:var(--brand); }

    #toast-container { position:fixed; top:1rem; left:1rem; right:1rem; z-index:200; max-width:400px; margin:0 auto; }
    .toast { background:var(--gray-900); color:#fff; padding:.75rem 1rem; border-radius:var(--r-md); font-size:.85rem; font-weight:500; margin-bottom:.5rem; }
    .toast.success { background:#065f46; }
    .toast.error   { background:#991b1b; }
  </style>
</head>
<body>
<header class="top-bar">
  <span class="top-bar-logo">xchodedos</span>
  <span class="top-bar-title">Settings</span>
  <div id="notifBell"></div>
  <div class="top-bar-avatar" id="avatarBtn"></div>
</header>

<main class="page-content">

  <!-- App Configuration -->
  <div class="settings-section">
    <div class="settings-label">App Configuration</div>
    <div class="settings-list" style="padding:1rem">
      <label style="font-size:.75rem;font-weight:600;color:var(--gray-600);display:block;margin-bottom:.4rem">WhatsApp Photo Number</label>
      <p style="font-size:.72rem;color:var(--gray-400);margin-bottom:.6rem">Drivers are directed here to send vehicle photos every Monday and Friday. Format: country code + number, no leading 0 or +, e.g. 233506963125.</p>
      <div style="display:flex;gap:.5rem">
        <input type="text" id="waNumberInput" placeholder="233506963125" style="flex:1;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.85rem"/>
        <button onclick="saveWaNumber()" style="background:var(--brand);color:#fff;border:none;padding:.6rem 1rem;border-radius:8px;font-weight:600;font-size:.82rem">Save</button>
      </div>
      <div id="waNumberMsg" style="font-size:.75rem;margin-top:.5rem;display:none"></div>
    </div>
  </div>

  <!-- Sign out -->
  <div class="settings-section">
    <div class="settings-list">
      <div class="settings-row danger" onclick="handleLogout()">
        <div class="settings-icon red">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
        <div class="settings-title">Sign Out</div>
      </div>
    </div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="/pages/officer/dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
  <a href="/pages/officer/drivers.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Drivers</a>
  <a href="/pages/officer/create-lead.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>New Lead</a>
  <a href="/pages/officer/checks.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Checks</a>
  <a href="/pages/officer/settings.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
</nav>
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/notifications.js"></script>
<script src="/js/sync.js"></script>
<script>
  const SUPABASE_URL      = 'https://lhcrfsemshilnzyqoypd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoY3Jmc2Vtc2hpbG56eXFveXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTM2ODUsImV4cCI6MjEwNDQ2OTY4NX0.bPqqrijUXEfvrB9mTbkPiicAcEbeMsDgO-STfo4Btjw';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let officerProfile = null;

  function toast(msg, type='default') { const c=document.getElementById('toast-container'); const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; c.appendChild(el); setTimeout(()=>el.remove(),3000); }

  window.handleLogout = async () => {
    if (!confirm('Sign out?')) return;
    await db.auth.signOut();
    window.location.href = '/index.html';
  };

  window.loadWaNumber = async () => {
    const { data } = await db.from('app_settings').select('value').eq('key', 'whatsapp_photo_number').maybeSingle();
    if (data) document.getElementById('waNumberInput').value = data.value || '';
  };

  window.saveWaNumber = async () => {
    const val = document.getElementById('waNumberInput').value.trim();
    const msg = document.getElementById('waNumberMsg');
    if (!/^\d{10,15}$/.test(val)) {
      msg.textContent = 'Enter digits only, with country code, no + or leading 0.';
      msg.style.color = '#991b1b';
      msg.style.display = 'block';
      return;
    }
    const { error } = await db.from('app_settings').update({ value: val, updated_at: new Date().toISOString(), updated_by: officerProfile.id }).eq('key', 'whatsapp_photo_number');
    msg.style.display = 'block';
    if (error) { msg.textContent = 'Failed to save: ' + error.message; msg.style.color = '#991b1b'; toast('Save failed', 'error'); }
    else { msg.textContent = 'Saved ✓'; msg.style.color = '#065f46'; toast('WhatsApp number updated', 'success'); }
  };

  async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = '/index.html'; return; }
    const { data: p } = await db.from('profiles').select('*').eq('id', session.user.id).single();
    if (!p || !['relationship_officer', 'super_admin'].includes(p.role)) { window.location.href = '/index.html'; return; }
    officerProfile = p;

    const ini = p.full_name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    const av = document.getElementById('avatarBtn');
    av.textContent = ini;
    initNotificationBell(p.id, 'notifBell');

    await loadWaNumber();
  }
  init();
</script>
</body>
</html>
