<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>xchodedos — Driver Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:#1a56db; --brand-dark:#1239a5; --brand-light:#e8eeff;
      --success:#12b76a; --success-bg:#ecfdf3; --warning:#f59e0b; --warning-bg:#fffbeb;
      --danger:#ef4444; --danger-bg:#fef2f2;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
      --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
      --gray-800:#1f2937; --gray-900:#111827;
      --border:#e5e7eb; --bg:#f5f7ff;
      --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
      --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:9999px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.08); --nav-h:64px;
    }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:var(--font-body); background:var(--bg); color:var(--gray-800); min-height:100dvh; }
    a { text-decoration:none; color:inherit; }
    button { cursor:pointer; font-family:inherit; }

    .top-bar { position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--border); padding:.875rem 1rem; display:flex; align-items:center; gap:.75rem; }
    .top-bar-logo { font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--brand); }
    .top-bar-title { font-weight:600; font-size:1rem; flex:1; color:var(--gray-800); }
    .top-bar-avatar { width:36px; height:36px; border-radius:var(--r-full); background:var(--brand-light); color:var(--brand); display:grid; place-items:center; font-weight:700; font-size:.8rem; cursor:pointer; }
    .back-btn { display:inline-flex; align-items:center; gap:.3rem; color:var(--gray-500); font-size:.85rem; font-weight:500; background:none; border:none; padding:0; cursor:pointer; }
    .back-btn:hover { color:var(--brand); }

    .page-content { padding:1.25rem 1rem calc(var(--nav-h) + 1.25rem); max-width:540px; margin:0 auto; }

    /* Profile hero */
    .driver-hero { background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); padding:1.5rem; margin-bottom:1rem; text-align:center; box-shadow:var(--shadow-sm); }
    .hero-avatar { width:72px; height:72px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:1.5rem; margin:0 auto 1rem; }
    .hero-name { font-family:var(--font-display); font-weight:700; font-size:1.2rem; color:var(--gray-900); margin-bottom:.25rem; }
    .hero-sub  { font-size:.82rem; color:var(--gray-400); }
    .hero-actions { display:flex; gap:.75rem; margin-top:1.25rem; justify-content:center; }

    /* Detail rows */
    .detail-card { background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); padding:1rem 1.25rem; margin-bottom:1rem; box-shadow:var(--shadow-sm); }
    .detail-card-title { font-family:var(--font-display); font-size:.82rem; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.07em; margin-bottom:.875rem; }
    .detail-row { display:flex; justify-content:space-between; align-items:flex-start; padding:.55rem 0; border-bottom:1px solid var(--gray-100); font-size:.85rem; gap:1rem; }
    .detail-row:last-child { border-bottom:none; }
    .detail-key { color:var(--gray-400); font-weight:500; flex-shrink:0; }
    .detail-val { color:var(--gray-800); font-weight:600; text-align:right; }

    /* Car card */
    .car-assigned { background:var(--brand-light); border:1px solid rgba(26,86,219,.2); border-radius:var(--r-md); padding:1rem; display:flex; align-items:center; gap:.875rem; margin-bottom:1rem; }
    .car-icon { width:40px; height:40px; border-radius:var(--r-sm); background:var(--brand); color:#fff; display:grid; place-items:center; flex-shrink:0; }
    .car-name { font-weight:700; font-size:.92rem; color:var(--gray-900); }
    .car-sub  { font-size:.75rem; color:var(--gray-500); margin-top:.15rem; }

    /* Payment list */
    .payment-row { display:flex; justify-content:space-between; align-items:center; padding:.75rem 0; border-bottom:1px solid var(--gray-100); font-size:.85rem; }
    .payment-row:last-child { border-bottom:none; }

    .ledger-wrap { overflow-x:auto; margin:0 -1.25rem; padding:0 1.25rem; }
    .ledger-table { width:100%; border-collapse:collapse; font-size:.82rem; min-width:640px; }
    .ledger-table th { text-align:left; font-size:.68rem; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; padding:.5rem .6rem; border-bottom:1px solid var(--gray-100); white-space:nowrap; }
    .ledger-table td { padding:.7rem .6rem; border-bottom:1px solid var(--gray-100); vertical-align:middle; white-space:nowrap; }
    .ledger-table tr:last-child td { border-bottom:none; }
    .ledger-wk { color:var(--gray-400); font-weight:600; }
    .ledger-paid-amt { font-weight:700; }
    .ledger-delta { color:var(--danger); font-size:.75rem; margin-top:.1rem; }
    .ledger-actions { display:flex; gap:.4rem; }
    .ledger-btn { border:none; border-radius:6px; padding:.3rem .55rem; font-size:.72rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:.25rem; }
    .ledger-btn.edit { background:var(--gray-100); color:var(--gray-700); }
    .ledger-btn.del  { background:var(--danger-bg); color:#991b1b; }
    .ledger-foot td { font-weight:700; border-bottom:none; padding-top:.85rem; }
    .payment-amount { font-weight:700; color:var(--gray-900); }
    .payment-meta   { font-size:.75rem; color:var(--gray-400); margin-top:.1rem; }

    .badge { display:inline-flex; padding:.2rem .55rem; border-radius:var(--r-full); font-size:.68rem; font-weight:600; }
    .badge-green { background:var(--success-bg); color:#065f46; }
    .badge-amber { background:var(--warning-bg); color:#92400e; }
    .badge-red   { background:var(--danger-bg);  color:#991b1b; }
    .badge-gray  { background:var(--gray-100);    color:var(--gray-600); }
    .badge-blue  { background:var(--brand-light); color:var(--brand-dark); }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.55rem .875rem; border:none; border-radius:var(--r-sm); font-family:var(--font-body); font-size:.78rem; font-weight:600; cursor:pointer; text-decoration:none; }
    .btn-primary { background:var(--brand); color:#fff; }
    .btn-outline { background:transparent; color:var(--brand); border:1.5px solid var(--brand); }
    .btn-ghost   { background:transparent; color:var(--gray-600); border:1.5px solid var(--border); }

    .empty-state { text-align:center; padding:1.5rem 1rem; color:var(--gray-400); font-size:.85rem; }
    .skeleton { background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; }
    @keyframes shimmer { to { background-position:-200% 0; } }

    .progress-row { margin-bottom:1.1rem; }
    .progress-row:last-child { margin-bottom:0; }
    .progress-label { display:flex; justify-content:space-between; font-size:.8rem; margin-bottom:.4rem; }
    .progress-label span:first-child { color:var(--gray-500); font-weight:500; }
    .progress-label span:last-child { color:var(--gray-800); font-weight:700; }
    .progress-track { height:8px; border-radius:var(--r-full); background:var(--gray-100); overflow:hidden; }
    .progress-fill { height:100%; border-radius:var(--r-full); background:var(--brand); transition:width .3s; }
    .progress-fill.warn { background:var(--warning); }
    .progress-fill.danger { background:var(--danger); }
    .progress-dates { display:flex; justify-content:space-between; font-size:.72rem; color:var(--gray-400); margin-top:.35rem; }

    /* Credentials card */
    .cred-card { background:var(--brand-light); border:1px solid rgba(26,86,219,.25); }
    .cred-row { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0; }
    .cred-row + .cred-row { border-top:1px solid rgba(26,86,219,.15); }
    .cred-label { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--brand-dark); }
    .cred-value { font-family:monospace; font-size:.88rem; font-weight:600; color:var(--gray-900); word-break:break-all; }
    .cred-copy { background:none; border:none; color:var(--brand); font-size:.75rem; font-weight:700; cursor:pointer; padding:.2rem .5rem; flex-shrink:0; }

    /* Danger zone */
    .danger-zone { border:1px solid #fca5a5; }
    .danger-zone .detail-card-title { color:#991b1b; }
    .form-group { margin-bottom:.875rem; }
    .form-label { display:block; font-size:.72rem; font-weight:600; color:var(--gray-600); letter-spacing:.05em; text-transform:uppercase; margin-bottom:.35rem; }
    .form-input { width:100%; background:var(--gray-50); border:1.5px solid var(--border); border-radius:var(--r-sm); color:var(--gray-800); font-family:var(--font-body); font-size:.88rem; padding:.6rem .8rem; outline:none; }
    .form-input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(26,86,219,.12); background:#fff; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
    .error-box { padding:.7rem; background:var(--danger-bg); border:1px solid #fca5a5; border-radius:var(--r-sm); font-size:.8rem; color:#991b1b; margin-top:.75rem; display:none; }
    .error-box.show { display:block; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:var(--nav-h); background:#fff; border-top:1px solid var(--border); display:flex; z-index:50; box-shadow:0 -4px 16px rgba(0,0,0,.06); }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.2rem; border:none; background:none; color:var(--gray-400); font-size:.65rem; font-weight:500; padding:.5rem 0; text-decoration:none; transition:color .15s; }
    .nav-item svg { width:22px; height:22px; }
    .nav-item.active { color:var(--brand); }

    #toast-container { position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:999; width:calc(100% - 2rem); max-width:420px; pointer-events:none; }
    .toast { background:var(--gray-900); color:#fff; padding:.75rem 1rem; border-radius:var(--r-md); font-size:.85rem; font-weight:500; margin-bottom:.5rem; animation:toast-in .2s ease; }
    .toast.success { background:#065f46; }
    .toast.error   { background:#991b1b; }
    @keyframes toast-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:100; }
    .modal-overlay.open { display:flex; }
    .modal-sheet { background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:1.25rem; max-height:85vh; overflow-y:auto; }
    .edit-icon-btn { background:none; border:none; color:var(--gray-400); cursor:pointer; padding:.2rem; display:inline-flex; }
    .edit-icon-btn:hover { color:var(--brand); }
  </style>
</head>

<script>
  const SUPABASE_URL      = 'https://kgbqjcataatpfpxfvkpc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYnFqY2F0YWF0cGZweGZ2a3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDk5ODksImV4cCI6MjA5NzYyNTk4OX0.qJ8qiYWxNGLRXM6QRByNdnawsOSOirVQ3azi--DLSrM';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let driver = null, driverId = null, assignment = null, editDetailsOpen = false, leadRow = null;

  function escAttr(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toast(msg, type='default') {
    const c=document.getElementById('toast-container'); const el=document.createElement('div');
    el.className='toast '+type; el.textContent=msg; c.appendChild(el); setTimeout(()=>el.remove(),3000);
  }

  // Snaps any date back to the Monday of its calendar week.
  function getMondayOf(date) {
    const d = new Date(date); d.setHours(0,0,0,0);
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = day === 0 ? -6 : 1 - day;
    return new Date(d.getTime() + diff*24*60*60*1000);
  }

  // Weeks are always calendar Monday–Sunday, regardless of what day the
  // contract actually started on — week 1 is the Mon–Sun block containing
  // hire_start_date, even if that means it's a "short" first week. A week
  // only counts as "due" once it has fully elapsed. A week is "missed" if
  // the total paid against it is less than what's owed.
  function computeMissedWeeks(hireStart, weeklyPayment, payments) {
    const start = getMondayOf(hireStart);
    const today = new Date(); today.setHours(0,0,0,0);
    const msPerWeek = 7*24*60*60*1000;

    const dueWeeks = [];
    for (let cursor = new Date(start); cursor.getTime() + msPerWeek <= today.getTime(); cursor = new Date(cursor.getTime()+msPerWeek)) {
      dueWeeks.push(cursor.toISOString().split('T')[0]);
    }

    // Match by date-range offset from the Monday-anchored start, not exact
    // string equality — tolerant of payments stamped with any date that
    // falls within the correct Mon–Sun window.
    const paidByIndex = new Map();
    (payments||[]).forEach(p => {
      if (p.status !== 'paid' || p.payment_method === 'deposit' || !p.week_starting) return;
      const pDate = new Date(p.week_starting); pDate.setHours(0,0,0,0);
      const idx = Math.floor((pDate - start) / msPerWeek);
      if (idx < 0) return;
      paidByIndex.set(idx, (paidByIndex.get(idx)||0) + parseFloat(p.amount||0));
    });

    let missedStreak = 0;
    const missedWeeks = [];
    for (let i = dueWeeks.length - 1; i >= 0; i--) {
      const paid = paidByIndex.get(i) || 0;
      if (paid + 0.01 < weeklyPayment) { missedStreak++; missedWeeks.unshift(dueWeeks[i]); }
      else break;
    }
    return { missedStreak, missedWeeks };
  }

  // Builds one row per calendar week (Monday–Sunday) from the week
  // containing hire_start_date through the current week (inclusive —
  // unlike computeMissedWeeks, this includes the week that's currently in
  // progress, so the RO can see today's status immediately).
  function buildWeeklyLedger(assignment, payments) {
    if (!assignment?.hire_start_date || !assignment.weekly_payment) return [];
    const start = getMondayOf(assignment.hire_start_date);
    const today = new Date(); today.setHours(0,0,0,0);
    const msPerWeek = 7*24*60*60*1000;
    const weekly = parseFloat(assignment.weekly_payment);

    // Bucket each payment by which Mon–Sun week-slot it actually falls
    // into (by date offset from the Monday-anchored start), not by an
    // exact string match on week_starting — tolerant of payments stamped
    // with any date inside the correct window.
    const weeklyPayments = (payments||[]).filter(p => p.payment_method !== 'deposit' && p.week_starting);
    const paidByIndex = new Map();
    const recordByIndex = new Map();
    weeklyPayments.forEach(p => {
      const pDate = new Date(p.week_starting); pDate.setHours(0,0,0,0);
      const idx = Math.floor((pDate - start) / msPerWeek);
      if (idx < 0) return; // payment dated before the contract's first week — ignore
      recordByIndex.set(idx, p);
      if (p.status === 'paid') paidByIndex.set(idx, (paidByIndex.get(idx)||0) + parseFloat(p.amount||0));
    });

    const weeks = [];
    let wk = 1, idx = 0;
    for (let cursor = new Date(start); cursor <= today; cursor = new Date(cursor.getTime()+msPerWeek), wk++, idx++) {
      const weekStart = cursor.toISOString().split('T')[0];
      const weekEnd = new Date(cursor.getTime() + 6*24*60*60*1000).toISOString().split('T')[0];
      const paid = paidByIndex.get(idx) || 0;
      const status = paid <= 0 ? 'missed' : (paid < weekly ? 'partial' : 'paid');
      weeks.push({ wk, weekStart, weekEnd, due: weekly, paid, status, record: recordByIndex.get(idx) || null });
    }
    return weeks.reverse(); // most recent week first
  }

  window.saveContractEdit = async () => {
    const errEl = document.getElementById('contractErr');
    const weekly = parseFloat(document.getElementById('editWeekly').value);
    const start = document.getElementById('editStart').value;
    const end = document.getElementById('editEnd').value || null;
    const totalValueRaw = document.getElementById('editTotalValue').value;
    const totalValue = totalValueRaw ? parseFloat(totalValueRaw) : null;
    if (!weekly || weekly <= 0) { errEl.textContent = 'Enter a valid weekly payment amount.'; errEl.style.display = 'block'; return; }
    if (!start) { errEl.textContent = 'Start date is required.'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('saveContractBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const { error } = await db.from('driver_assignments').update({
        weekly_payment: weekly, hire_start_date: start, hire_end_date: end,
        total_contract_value: totalValue,
      }).eq('id', assignment.id);
      if (error) throw error;
      toast('Contract updated', 'success');
      closeContractModal();
      await init();
    } catch(e) {
      errEl.textContent = e.message || 'Failed to update contract.'; errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  };

  // ── Edit an individual payment (weekly payment OR the initial deposit —
  // the deposit is just a payments row with payment_method='deposit', so
  // this same modal covers both). ──
  let editingPaymentId = null;
  window.openPaymentEdit = (p) => {
    editingPaymentId = p.id;
    document.getElementById('paymentModalTitle').textContent = p.payment_method === 'deposit' ? 'Edit Initial Deposit' : 'Edit Payment';
    document.getElementById('editAmount').value = p.amount;
    document.getElementById('editWeekStarting').value = p.week_starting;
    document.getElementById('editStatus').value = p.status;
    document.getElementById('editNotes').value = p.notes || '';
    document.getElementById('paymentErr').style.display = 'none';
    document.getElementById('paymentModal').classList.add('open');
  };

  // Opens the same modal for a week row from the ledger table — if that
  // week already has a payment record, edits it; if not (a "Missed" week
  // with nothing recorded yet), this creates a new one on save instead.
  window.openWeekEdit = (week) => {
    if (week.record) { openPaymentEdit(week.record); return; }
    editingPaymentId = null;
    document.getElementById('paymentModalTitle').textContent = `Record Payment — Week ${week.wk}`;
    document.getElementById('editAmount').value = week.due;
    document.getElementById('editWeekStarting').value = week.weekStart;
    document.getElementById('editStatus').value = 'paid';
    document.getElementById('editNotes').value = '';
    document.getElementById('paymentErr').style.display = 'none';
    document.getElementById('paymentModal').classList.add('open');
  };

  window.deleteWeekPayment = async (paymentId) => {
    if (!confirm('Delete this payment record? This cannot be undone.')) return;
    const { error } = await db.from('payments').delete().eq('id', paymentId);
    if (error) { toast('Failed to delete: ' + error.message, 'error'); return; }
    toast('Payment deleted', 'success');
    await init();
  };

  window.closePaymentModal = (e) => { if (!e || e.target === document.getElementById('paymentModal')) document.getElementById('paymentModal').classList.remove('open'); };

  window.savePaymentEdit = async () => {
    const errEl = document.getElementById('paymentErr');
    const amount = parseFloat(document.getElementById('editAmount').value);
    const weekStarting = document.getElementById('editWeekStarting').value;
    if (!amount || amount < 0) { errEl.textContent = 'Enter a valid amount.'; errEl.style.display = 'block'; return; }
    if (!weekStarting) { errEl.textContent = 'Week starting date is required.'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('savePaymentBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const fields = {
        amount, week_starting: weekStarting,
        status: document.getElementById('editStatus').value,
        notes: document.getElementById('editNotes').value.trim() || null,
      };
      const { error } = editingPaymentId
        ? await db.from('payments').update(fields).eq('id', editingPaymentId)
        : await db.from('payments').insert({ ...fields, driver_id: driverId, assignment_id: assignment?.id || null });
      if (error) throw error;
      toast('Payment saved', 'success');
      closePaymentModal();
      await init();
    } catch(e) {
      errEl.textContent = e.message || 'Failed to update payment.'; errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  };

  window.addDepositInstallment = async () => {
    const errEl = document.getElementById('depositErr');
    errEl.style.display = 'none';
    const amt = parseFloat(document.getElementById('depositInstallment').value);
    if (!amt || amt <= 0) { errEl.textContent = 'Enter a valid amount.'; errEl.style.display = 'block'; return; }

    const { error: payErr } = await db.from('payments').insert({
      driver_id: driverId,
      amount: amt,
      week_starting: new Date().toISOString().split('T')[0],
      status: 'paid',
      paid_at: new Date().toISOString(),
      payment_method: 'deposit',
      notes: 'Deposit installment',
    });
    if (payErr) { errEl.textContent = payErr.message; errEl.style.display = 'block'; return; }

    // Recompute total and auto-flip deposit_paid on the linked lead record once target is reached
    if (leadRow) {
      const { data: allDp } = await db.from('payments').select('amount').eq('driver_id', driverId).eq('payment_method','deposit');
      const totalPaid = (allDp||[]).reduce((s,p) => s + parseFloat(p.amount||0), 0);
      const required = parseFloat(leadRow.security_deposit||0);
      const nowFullyPaid = required > 0 && totalPaid >= required;
      if (nowFullyPaid !== leadRow.deposit_paid) {
        const updates = { deposit_paid: nowFullyPaid };
        if (nowFullyPaid) updates.deposit_paid_at = new Date().toISOString();
        await db.from('leads').update(updates).eq('id', leadRow.id);
      }
    }

    toast('Deposit payment recorded', 'success');
    init();
  };

  window.copyCred = async (text, btn) => {
    try {
      await navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = '✅';
      setTimeout(() => { btn.textContent = old; }, 1500);
    } catch { alert(text); }
  };

  window.copyBothCreds = async () => {
    const text = `xchodedos login\nEmail: ${driver.email}\nPassword: ${driver.temp_login_password}`;
    try { await navigator.clipboard.writeText(text); toast('Credentials copied','success'); }
    catch { alert(text); }
  };

  window.toggleEditDetails = () => { editDetailsOpen = !editDetailsOpen; renderPersonal(); };

  window.saveDetails = async () => {
    const errEl = document.getElementById('editErr');
    errEl.classList.remove('show');
    const updates = {
      full_name: document.getElementById('editFullName').value.trim(),
      phone: document.getElementById('editPhone').value.trim() || null,
      id_number: document.getElementById('editIdNumber').value.trim() || null,
      address: document.getElementById('editAddress').value.trim() || null,
      emergency_contact: document.getElementById('editEmergencyName').value.trim() || null,
      emergency_phone: document.getElementById('editEmergencyPhone').value.trim() || null,
    };
    if (!updates.full_name) { errEl.textContent='Full name is required.'; errEl.classList.add('show'); return; }
    const { error } = await db.from('profiles').update(updates).eq('id', driverId);
    if (error) { errEl.textContent = error.message; errEl.classList.add('show'); return; }
    Object.assign(driver, updates);
    toast('Details updated','success');
    editDetailsOpen = false;
    renderPersonal();
    document.getElementById('pageTitle').textContent = driver.full_name.split(' ')[0];
  };

  window.toggleActive = async () => {
    const goingActive = driver.is_active === false;
    if (!confirm(goingActive ? 'Reactivate this account so they can log in again?' : 'Deactivate this account? They will no longer be able to log in.')) return;
    const { error } = await db.from('profiles').update({ is_active: goingActive }).eq('id', driverId);
    if (error) { toast('Failed to update account status','error'); return; }
    driver.is_active = goingActive;
    toast(goingActive ? 'Account reactivated' : 'Account deactivated', 'success');
    init();
  };

  window.terminateContract = async () => {
    if (!assignment) return;
    if (!confirm('Terminate this contract? This ends the assignment and frees up the vehicle for reassignment.')) return;
    const { error: aErr } = await db.from('driver_assignments').update({ is_active:false, unassigned_at:new Date().toISOString() }).eq('id', assignment.id);
    if (aErr) { toast('Failed to terminate contract: ' + aErr.message, 'error'); return; }
    if (assignment.car_id) {
      const { error: cErr } = await db.from('cars').update({ status:'available' }).eq('id', assignment.car_id);
      if (cErr) console.error('Failed to free up car:', cErr);
    }
    await db.from('officer_driver_assignments').update({ is_active:false }).eq('driver_id', driverId);
    toast('Contract terminated','success');
    init();
  };

  window.deleteDriver = async () => {
    if (!confirm('Delete this driver? This permanently removes their profile, assignment history, and deactivates their login. This cannot be undone.')) return;
    if (assignment) {
      await db.from('cars').update({ status:'available' }).eq('id', assignment.car_id);
    }
    const { error } = await db.from('profiles').delete().eq('id', driverId);
    if (error) { toast('Failed to delete driver: ' + error.message, 'error'); return; }
    toast('Driver deleted','success');
    setTimeout(() => { window.location.href = '/pages/officer/drivers.html'; }, 800);
  };

  init();
</script>
</body>
</html>
