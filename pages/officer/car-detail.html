<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>xchodedos — Car Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:#1a56db; --brand-dark:#1239a5; --brand-light:#e8eeff;
      --success:#12b76a; --success-bg:#ecfdf3; --warning:#f59e0b; --warning-bg:#fffbeb;
      --danger:#ef4444; --danger-bg:#fef2f2;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db;
      --gray-400:#9ca3af; --gray-500:#6b7280; --gray-600:#4b5563; --gray-700:#374151;
      --gray-800:#1f2937; --gray-900:#111827;
      --border:#e5e7eb; --bg:#f5f7ff;
      --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif;
      --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:9999px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.08); --nav-h:64px;
    }
    html { -webkit-text-size-adjust:100%; }
    body { font-family:var(--font-body); background:var(--bg); color:var(--gray-800); min-height:100dvh; }
    a { text-decoration:none; color:inherit; }
    button { cursor:pointer; font-family:inherit; }

    .top-bar { position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--border); padding:.875rem 1rem; display:flex; align-items:center; gap:.75rem; }
    .top-bar-logo { font-family:var(--font-display); font-weight:700; font-size:1.1rem; color:var(--brand); }
    .top-bar-title { font-weight:600; font-size:1rem; flex:1; color:var(--gray-800); }
    .back-btn { display:inline-flex; align-items:center; gap:.3rem; color:var(--gray-500); font-size:.85rem; font-weight:500; background:none; border:none; padding:0; cursor:pointer; }
    .back-btn:hover { color:var(--brand); }

    .page-content { padding:1.25rem 1rem 3rem; max-width:560px; margin:0 auto; }

    .card { background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); padding:1.25rem; margin-bottom:1rem; box-shadow:var(--shadow-sm); }
    .car-hero-name { font-family:var(--font-display); font-weight:700; font-size:1.2rem; color:var(--gray-900); }
    .car-hero-sub { font-size:.85rem; color:var(--gray-500); margin-top:.15rem; }

    .badge { display:inline-block; padding:.25rem .6rem; border-radius:var(--r-full); font-size:.72rem; font-weight:600; }
    .badge-green { background:var(--success-bg); color:#065f46; }
    .badge-amber { background:var(--warning-bg); color:#92400e; }
    .badge-red   { background:var(--danger-bg);  color:#991b1b; }
    .badge-gray  { background:var(--gray-100);   color:var(--gray-600); }

    .maint-row { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.9rem 0; border-bottom:1px solid var(--border); }
    .maint-row:last-child { border-bottom:none; }
    .maint-label { font-weight:600; font-size:.88rem; color:var(--gray-800); }
    .maint-sub { font-size:.75rem; color:var(--gray-500); margin-top:.15rem; }
    .btn-log { background:var(--brand); color:#fff; border:none; border-radius:8px; padding:.45rem .75rem; font-size:.78rem; font-weight:600; white-space:nowrap; }

    .history-item { padding:.7rem 0; border-bottom:1px solid var(--border); font-size:.82rem; }
    .history-item:last-child { border-bottom:none; }
    .history-type { font-weight:600; color:var(--gray-800); }
    .history-date { color:var(--gray-500); font-size:.75rem; }
    .history-notes { color:var(--gray-500); font-size:.78rem; margin-top:.15rem; }

    .empty-state { text-align:center; padding:1.5rem 1rem; color:var(--gray-400); font-size:.85rem; }
    .skeleton { background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; }
    @keyframes shimmer { to { background-position:-200% 0; } }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; z-index:100; }
    .modal-overlay.open { display:flex; }
    .modal-sheet { background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:1.25rem; max-height:85vh; overflow-y:auto; }
    .form-group { margin-bottom:.9rem; }
    .form-label { font-size:.78rem; font-weight:600; color:var(--gray-600); margin-bottom:.35rem; display:block; }
    .form-input { width:100%; padding:.65rem .8rem; border:1px solid var(--border); border-radius:8px; font-size:.9rem; font-family:inherit; }
    .btn { border:none; border-radius:10px; padding:.75rem 1rem; font-size:.9rem; font-weight:600; }
    .btn-primary { background:var(--brand); color:#fff; }
    .btn-ghost { background:var(--gray-100); color:var(--gray-700); }
    .btn-full { width:100%; }

    #toast-container { position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:999; width:calc(100% - 2rem); max-width:420px; pointer-events:none; }
    .toast { background:var(--gray-900); color:#fff; padding:.7rem 1rem; border-radius:10px; font-size:.85rem; margin-bottom:.5rem; text-align:center; }
    .toast.success { background:#065f46; } .toast.error { background:#991b1b; }
  </style>
</head>
<body>
<header class="top-bar">
  <span class="top-bar-logo">xchodedos</span>
  <span class="top-bar-title">Car Detail</span>
</header>

<main class="page-content">
  <button class="back-btn" onclick="window.location.href='/pages/officer/fleet.html'" style="margin-bottom:.75rem">← Back to Fleet</button>

  <div class="card" id="carHero">
    <div class="skeleton" style="height:20px;width:60%;margin-bottom:.5rem"></div>
    <div class="skeleton" style="height:14px;width:40%"></div>
  </div>

  <div class="card">
    <div style="font-weight:700;font-size:.95rem;margin-bottom:.5rem">Maintenance Schedule</div>
    <div id="maintList"></div>
  </div>

  <div class="card">
    <div style="font-weight:700;font-size:.95rem;margin-bottom:.5rem">Service History</div>
    <div id="historyList"></div>
  </div>
</main>

<!-- Log Service modal -->
<div class="modal-overlay" id="logModal" onclick="closeLogModal(event)">
  <div class="modal-sheet">
    <div style="font-weight:700;font-size:1rem;margin-bottom:1rem" id="logModalTitle">Log Service</div>
    <div class="form-group">
      <label class="form-label" id="serviceDateLabel">Service Date</label>
      <input class="form-input" type="date" id="serviceDate"/>
    </div>
    <div class="form-group" id="dueDateGroup" style="display:none">
      <label class="form-label">Renewal / Expiry Date</label>
      <input class="form-input" type="date" id="serviceDueDate"/>
    </div>
    <div class="form-group" id="odometerGroup">
      <label class="form-label">Odometer (km, optional)</label>
      <input class="form-input" type="number" id="serviceOdometer" placeholder="e.g. 45200"/>
    </div>
    <div class="form-group" id="descriptionGroup" style="display:none">
      <label class="form-label">Description</label>
      <input class="form-input" id="serviceDescription" placeholder="e.g. Replaced front-left tire"/>
    </div>
    <div class="form-group">
      <label class="form-label">Cost (GHS, optional)</label>
      <input class="form-input" type="number" id="serviceCost" min="0" step="0.01" placeholder="0.00"/>
    </div>
    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <input class="form-input" id="serviceNotes" placeholder="e.g. Full synthetic, done at Total station"/>
    </div>
    <div id="logErr" style="display:none;margin-bottom:.75rem;padding:.7rem;background:var(--danger-bg);border-radius:8px;font-size:.8rem;color:#991b1b"></div>
    <div style="display:flex;gap:.6rem">
      <button class="btn btn-ghost" style="flex:1" onclick="closeLogModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" id="saveLogBtn" onclick="saveLog()">Save</button>
    </div>
  </div>
</div>

<!-- Edit Car modal -->
<div class="modal-overlay" id="editCarModal" onclick="closeEditCar(event)">
  <div class="modal-sheet">
    <div style="font-weight:700;font-size:1rem;margin-bottom:1rem">Edit Car Details</div>
    <div class="form-group"><label class="form-label">Make</label><input class="form-input" id="carMake"/></div>
    <div class="form-group"><label class="form-label">Model</label><input class="form-input" id="carModel"/></div>
    <div class="form-group"><label class="form-label">Year</label><input class="form-input" type="number" id="carYear"/></div>
    <div class="form-group"><label class="form-label">Color</label><input class="form-input" id="carColor"/></div>
    <div class="form-group"><label class="form-label">Plate Number</label><input class="form-input" id="carPlate" style="text-transform:uppercase"/></div>
    <div class="form-group"><label class="form-label">VIN / Chassis No.</label><input class="form-input" id="carVin"/></div>
    <div class="form-group"><label class="form-label">Status</label>
      <select class="form-input" id="carStatus">
        <option value="available">Available</option>
        <option value="assigned">Assigned</option>
        <option value="maintenance">In Maintenance</option>
        <option value="retired">Retired</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Weekly Rate (GHS)</label><input class="form-input" type="number" id="carWeeklyRate" min="0" step="0.01"/></div>
    <div class="form-group"><label class="form-label">Mileage (km)</label><input class="form-input" type="number" id="carMileage" min="0"/></div>
    <div class="form-group"><label class="form-label">Notes</label><input class="form-input" id="carNotes"/></div>
    <div id="editCarErr" style="display:none;margin-bottom:.75rem;padding:.7rem;background:var(--danger-bg);border-radius:8px;font-size:.8rem;color:#991b1b"></div>
    <div style="display:flex;gap:.6rem">
      <button class="btn btn-ghost" style="flex:1" onclick="closeEditCar()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" id="saveEditCarBtn" onclick="saveEditCar()">Save</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/maintenance.js"></script>
<script>
  const SUPABASE_URL      = 'https://kgbqjcataatpfpxfvkpc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYnFqY2F0YWF0cGZweGZ2a3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNDk5ODksImV4cCI6MjA5NzYyNTk4OX0.qJ8qiYWxNGLRXM6QRByNdnawsOSOirVQ3azi--DLSrM';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(location.search);
  const carId = params.get('id');
  let car = null, logs = [], officerId = null, pendingType = null;

  function toast(msg, type='default') {
    const c=document.getElementById('toast-container'); const el=document.createElement('div');
    el.className='toast '+type; el.textContent=msg; c.appendChild(el); setTimeout(()=>el.remove(),3000);
  }

  window.openLogModal = (type) => {
    pendingType = type;
    const cfg = MAINTENANCE_TYPES[type] || {};
    document.getElementById('logModalTitle').textContent = 'Log ' + (cfg.label || 'Service');
    document.getElementById('serviceDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('serviceOdometer').value = car?.mileage || '';
    document.getElementById('serviceNotes').value = '';
    document.getElementById('serviceCost').value = '';
    document.getElementById('serviceDescription').value = '';
    document.getElementById('serviceDueDate').value = '';
    document.getElementById('descriptionGroup').style.display = cfg.isGeneral ? '' : 'none';
    if (cfg.usesExplicitDueDate) {
      document.getElementById('serviceDateLabel').textContent = 'Renewal Date (today)';
      document.getElementById('dueDateGroup').style.display = '';
      document.getElementById('odometerGroup').style.display = 'none';
    } else {
      document.getElementById('serviceDateLabel').textContent = cfg.isGeneral ? 'Date' : 'Service Date';
      document.getElementById('dueDateGroup').style.display = 'none';
      document.getElementById('odometerGroup').style.display = '';
    }
    document.getElementById('logErr').style.display = 'none';
    document.getElementById('logModal').classList.add('open');
  };
  window.closeLogModal = (e) => { if (!e || e.target === document.getElementById('logModal')) document.getElementById('logModal').classList.remove('open'); };

  window.saveLog = async () => {
    const errEl = document.getElementById('logErr');
    const date = document.getElementById('serviceDate').value;
    if (!date) { errEl.textContent = 'Please pick a date.'; errEl.style.display = 'block'; return; }
    const cfg = MAINTENANCE_TYPES[pendingType] || {};
    const description = document.getElementById('serviceDescription').value.trim();
    if (cfg.isGeneral && !description) { errEl.textContent = 'Please describe the activity.'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('saveLogBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const odo = parseInt(document.getElementById('serviceOdometer').value) || null;
      const dueDate = document.getElementById('serviceDueDate').value || null;
      const cost = parseFloat(document.getElementById('serviceCost').value) || null;
      const extraNotes = document.getElementById('serviceNotes').value.trim();
      const notes = cfg.isGeneral
        ? [description, extraNotes].filter(Boolean).join(' — ') || null
        : (extraNotes || null);
      const { error } = await db.from('car_maintenance_log').insert({
        car_id: carId,
        maintenance_type: pendingType,
        service_date: date,
        next_due_date: dueDate,
        odometer: odo,
        cost,
        notes,
        recorded_by: officerId,
      });
      if (error) throw error;
      if (odo && odo > (car.mileage||0)) {
        await db.from('cars').update({ mileage: odo }).eq('id', carId);
      }
      toast('Logged', 'success');
      closeLogModal();
      await loadAll();
    } catch(e) {
      errEl.textContent = e.message || 'Failed to log activity.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  };

  function renderHero() {
    document.getElementById('carHero').innerHTML = `
      <div style="flex:1">
        <div class="car-hero-name">${car.make} ${car.model} ${car.year}</div>
        <div class="car-hero-sub">${car.plate_number}${car.color ? ' · '+car.color : ''} · ${car.mileage ? car.mileage.toLocaleString()+' km' : 'mileage unknown'}</div>
      </div>
      <button class="btn-log" onclick="openEditCar()">Edit</button>`;
  }

  window.openEditCar = () => {
    document.getElementById('carMake').value = car.make || '';
    document.getElementById('carModel').value = car.model || '';
    document.getElementById('carYear').value = car.year || '';
    document.getElementById('carColor').value = car.color || '';
    document.getElementById('carPlate').value = car.plate_number || '';
    document.getElementById('carVin').value = car.vin || '';
    document.getElementById('carStatus').value = car.status || 'available';
    document.getElementById('carWeeklyRate').value = car.weekly_rate || '';
    document.getElementById('carMileage').value = car.mileage || '';
    document.getElementById('carNotes').value = car.notes || '';
    document.getElementById('editCarErr').style.display = 'none';
    document.getElementById('editCarModal').classList.add('open');
  };
  window.closeEditCar = (e) => { if (!e || e.target === document.getElementById('editCarModal')) document.getElementById('editCarModal').classList.remove('open'); };

  window.saveEditCar = async () => {
    const errEl = document.getElementById('editCarErr');
    const make = document.getElementById('carMake').value.trim();
    const model = document.getElementById('carModel').value.trim();
    const year = parseInt(document.getElementById('carYear').value);
    const plate = document.getElementById('carPlate').value.trim().toUpperCase();
    if (!make || !model || !year || !plate) { errEl.textContent = 'Make, model, year, and plate number are required.'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('saveEditCarBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const { error } = await db.from('cars').update({
        make, model, year,
        color: document.getElementById('carColor').value.trim() || null,
        plate_number: plate,
        vin: document.getElementById('carVin').value.trim() || null,
        status: document.getElementById('carStatus').value,
        weekly_rate: parseFloat(document.getElementById('carWeeklyRate').value) || null,
        mileage: parseInt(document.getElementById('carMileage').value) || 0,
        notes: document.getElementById('carNotes').value.trim() || null,
      }).eq('id', carId);
      if (error) throw error;
      toast('Car details updated', 'success');
      closeEditCar();
      await loadAll();
    } catch(e) {
      errEl.textContent = e.message || 'Failed to update car.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Save';
    }
  };

  function renderMaintenance() {
    const summary = getCarMaintenanceSummary(logs);
    const statusBadge = { unknown:'badge-gray', ok:'badge-green', due_soon:'badge-amber', overdue:'badge-red' };
    const statusLabel = { unknown:'Not yet logged', ok:'Up to date', due_soon:'Due soon', overdue:'Overdue' };
    document.getElementById('maintList').innerHTML = Object.entries(summary).map(([type, s]) => `
      <div class="maint-row">
        <div>
          <div class="maint-label">${s.label}</div>
          <div class="maint-sub">
            Last: ${formatMaintenanceDate(s.lastServiceDate)}
            ${s.dueDate ? ` · Due: ${formatMaintenanceDate(s.dueDate)}` : ''}
            &nbsp;<span class="badge ${statusBadge[s.status]}">${statusLabel[s.status]}</span>
          </div>
        </div>
        <button class="btn-log" onclick="openLogModal('${type}')">Log Service</button>
      </div>
    `).join('');
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    if (!logs.length) { el.innerHTML = `<div class="empty-state">No service history yet.</div>`; return; }
    const sorted = [...logs].sort((a,b) => new Date(b.service_date) - new Date(a.service_date));
    el.innerHTML = sorted.map(l => `
      <div class="history-item">
        <div class="history-type">${MAINTENANCE_TYPES[l.maintenance_type]?.label || l.maintenance_type}</div>
        <div class="history-date">${formatMaintenanceDate(l.service_date)}${l.odometer ? ' · '+l.odometer.toLocaleString()+' km' : ''}${l.next_due_date ? ' · renews '+formatMaintenanceDate(l.next_due_date) : ''}${l.cost ? ' · GHS '+parseFloat(l.cost).toFixed(2) : ''}</div>
        ${l.notes ? `<div class="history-notes">${l.notes}</div>` : ''}
      </div>
    `).join('');
  }

  async function loadAll() {
    const [carRes, logsRes] = await Promise.all([
      db.from('cars').select('*').eq('id', carId).single(),
      db.from('car_maintenance_log').select('*').eq('car_id', carId),
    ]);
    if (carRes.error || !carRes.data) { toast('Car not found', 'error'); return; }
    car = carRes.data;
    logs = logsRes.data || [];
    renderHero();
    renderMaintenance();
    renderHistory();
  }

  async function init() {
    if (!carId) { window.location.href = '/pages/officer/fleet.html'; return; }
    const { data:{ session } } = await db.auth.getSession();
    if (!session) { window.location.href='/index.html'; return; }
    const { data: me } = await db.from('profiles').select('*').eq('id', session.user.id).single();
    if (!me || !['relationship_officer','super_admin'].includes(me.role)) { window.location.href='/index.html'; return; }
    officerId = me.id;
    await loadAll();
  }

  init();
</script>
</body>
</html>
